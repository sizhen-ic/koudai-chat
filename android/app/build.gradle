plugins {
    id 'com.android.application'
}

// 签名：密钥库不进仓库，构建时由 CI 从 Secrets 还原（见 SECURITY.md）。
// 本地构建时也可以自己放一个 koudai.p12 并导出 KOUDAL_STORE_PASS。
def keystoreFile = file('koudai.p12')
def ksPass = System.getenv('KOUDAL_STORE_PASS')
def ksAlias = System.getenv('KOUDAL_KEY_ALIAS') ?: 'koudai'
def hasKeystore = keystoreFile.exists() && ksPass != null && ksPass.length() > 0
if (keystoreFile.exists() && !hasKeystore) {
    logger.warn('[koudai] 找到 koudai.p12 但环境变量 KOUDAL_STORE_PASS 为空，本次将不签名')
}

def vCode = 1
def vName = '1.0'
def envCode = System.getenv('KOUDAL_VERSION_CODE')
if (envCode != null && envCode.isInteger()) { vCode = envCode.toInteger() }
def envName = System.getenv('KOUDAL_VERSION_NAME')
if (envName != null && envName.length() > 0) { vName = envName }

android {
    namespace 'ai.koudai.chat'
    compileSdk 34

    defaultConfig {
        applicationId "ai.koudai.chat"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        koudai {
            if (hasKeystore) {
                storeFile keystoreFile
                storeType 'PKCS12'
                storePassword ksPass
                keyAlias ksAlias
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) signingConfig signingConfigs.koudai
        }
        release {
            if (hasKeystore) signingConfig signingConfigs.koudai
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
