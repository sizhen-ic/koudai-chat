plugins {
    id 'com.android.application'
}

// 固定签名：密钥一旦生成并提交，之后所有构建都相同 → 可以直接覆盖安装
def keystoreFile = file('koudai.jks')
def hasKeystore = keystoreFile.exists()

android {
    namespace 'ai.koudai.chat'
    compileSdk 34

    defaultConfig {
        applicationId "ai.koudai.chat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        koudai {
            if (hasKeystore) {
                storeFile keystoreFile
                storePassword 'koudai123456'
                keyAlias 'koudai'
                keyPassword 'koudai123456'
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) signingConfig signingConfigs.koudai
        }
        release {
            if (hasKeystore) signingConfig signingConfigs.koudai
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
