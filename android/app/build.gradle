plugins {
    id 'com.android.application'
}

// 固定签名：密钥一旦确定，之后所有构建都相同 → 可以直接覆盖安装。
// 口令优先读环境变量，读不到才回退到历史值（该值已在公开仓库历史里，视为已泄露）。
def keystoreFile = file('koudai.jks')
def hasKeystore = keystoreFile.exists()
def ksPass = System.getenv('KOUDAL_STORE_PASS') ?: 'koudai123456'

def vCode = 1
def vName = '1.0'
def envCode = System.getenv('KOUDAL_VERSION_CODE')
if (envCode != null && envCode.isInteger()) { vCode = envCode.toInteger() }
def envName = System.getenv('KOUDAL_VERSION_NAME')
if (envName != null && envName.length() > 0) { vName = envName }

android {
    namespace 'ai.koudai.chat'
    compileSdk 34

    defaultConfig {
        applicationId "ai.koudai.chat"
        minSdk 24
        targetSdk 34
        versionCode vCode
        versionName vName
    }

    signingConfigs {
        koudai {
            if (hasKeystore) {
                storeFile keystoreFile
                storePassword ksPass
                keyAlias 'koudai'
                keyPassword ksPass
            }
        }
    }

    buildTypes {
        debug {
            if (hasKeystore) signingConfig signingConfigs.koudai
        }
        release {
            if (hasKeystore) signingConfig signingConfigs.koudai
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
