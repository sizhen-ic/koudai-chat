plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.koudai.chat'
    compileSdk 34

    defaultConfig {
        applicationId "ai.koudai.chat"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            // 本地/自用构建用 debug 签名即可；要发布请自备 keystore
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 打包时把仓库根目录的网页资源收进 assets
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
