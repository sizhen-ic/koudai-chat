name: build-apk

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查自带的 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "没有这个目录"
          echo "--- platforms ---"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "--- build-tools ---"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true
          echo "--- cmdline-tools ---"
          ls "$ANDROID_HOME/cmdline-tools" 2>/dev/null || true

      - name: 缺组件就补装（通常不需要）
        run: |
          SDK="$ANDROID_HOME"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            if [ -x "$SM" ]; then
              yes | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" "platforms;android-34" "build-tools;34.0.0" || true
            else
              echo "找不到 sdkmanager，无法补装"
            fi
          fi
          ls "$SDK/platforms" || true

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 固定签名密钥（保证以后能覆盖安装）
        working-directory: android
        run: |
          cd app
          if [ ! -f koudai.jks ]; then
            echo "第一次构建：生成固定签名密钥"
            keytool -genkeypair -v -keystore koudai.jks -storetype PKCS12 -alias koudai \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass koudai123456 -keypass koudai123456 \
              -dname "CN=Koudai App, OU=SelfUse, O=Personal, L=City, ST=State, C=CN"
          else
            echo "已存在固定密钥，直接复用"
          fi
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/koudai.jks
          if ! git diff --cached --quiet; then
            git commit -m "chore: 固定签名密钥（此后可覆盖安装）"
            git push
          fi

      - name: 把网页资源放进 assets
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp ../index.html ../sw.js ../manifest.webmanifest \
             ../icon-192.png ../icon-512.png ../icon-maskable-512.png \
             ../apple-touch-icon.png ../favicon.png \
             app/src/main/assets/
          rm -rf app/src/main/assets/katex
          cp -r ../katex app/src/main/assets/katex
          ls -la app/src/main/assets/
          echo "katex 文件数: $(find app/src/main/assets/katex -type f | wc -l)"

      - name: 编译 debug APK
        working-directory: android
        run: |
          java -version
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: koudai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases（方便手机直接下载）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --title "口袋对话 $TAG" \
            --notes "自动构建 · 由 GitHub Actions 生成" \
            || echo "发布跳过（可能已存在）"
          echo "下载地址："
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/app-debug.apk"
