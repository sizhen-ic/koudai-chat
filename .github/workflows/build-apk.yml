name: build-apk

# 只在 main 分支或手动触发时构建。
# 之前是任意分支 push 都构建并发版，配合写权限 token 风险偏大。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 默认最小权限；只有需要发版的那个 job 才给写权限
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      # 第三方 action 一律锁到 commit SHA，防止上游标签被改写导致供应链投毒
      - name: 取出代码
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: 安装 JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 检查自带的 Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" 2>/dev/null || echo "没有这个目录"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || true

      - name: 缺组件就补装（通常不需要）
        run: |
          SDK="$ANDROID_HOME"
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$SDK/platforms/android-34" ]; then
            if [ -x "$SM" ]; then
              yes | "$SM" --licenses > /dev/null 2>&1 || true
              "$SM" "platforms;android-34" "build-tools;34.0.0" || true
            else
              echo "找不到 sdkmanager，无法补装"
            fi
          fi
          ls "$SDK/platforms" || true

      - name: 安装 Gradle 8.7
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.7'

      # 密钥库不在仓库里，从 Secrets 还原。
      # 需要先配置 KEYSTORE_BASE64 与 KEYSTORE_PASSWORD（见 SECURITY.md）。
      - name: 还原签名密钥
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::error::缺少 KEYSTORE_BASE64 secret。到 Settings → Secrets and variables → Actions 添加 KEYSTORE_BASE64 与 KEYSTORE_PASSWORD 后重跑。"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > android/app/koudai.p12
          if [ ! -s android/app/koudai.p12 ]; then
            echo "::error::还原出来的密钥库是空的，检查 KEYSTORE_BASE64 是否完整（应为单行 base64）"
            exit 1
          fi
          echo "已从 Secrets 还原签名密钥：$(stat -c%s android/app/koudai.p12) 字节"

      - name: 把网页资源放进 assets
        working-directory: android
        run: |
          mkdir -p app/src/main/assets
          cp ../index.html ../sw.js ../manifest.webmanifest \
             ../icon-192.png ../icon-512.png ../icon-maskable-512.png \
             ../apple-touch-icon.png ../favicon.png ../bg.jpg \
             app/src/main/assets/
          rm -rf app/src/main/assets/katex
          cp -r ../katex app/src/main/assets/katex
          ls -la app/src/main/assets/
          echo "katex 文件数: $(find app/src/main/assets/katex -type f | wc -l)"

      - name: 编译 APK
        working-directory: android
        env:
          KOUDAL_VERSION_CODE: ${{ github.run_number }}
          KOUDAL_VERSION_NAME: "1.0.${{ github.run_number }}"
          KOUDAL_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          java -version
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: 上传 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: koudai-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: 发布到 Releases（附 SHA-256 便于校验）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          TAG="v1.0.${{ github.run_number }}"
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(du -h "$APK" | cut -f1)
          echo "SHA256=$SHA"
          gh release create "$TAG" "$APK" \
            --title "蓝色大肥鱼 $TAG" \
            --notes "$(printf '自动构建 · GitHub Actions 生成\n\n- 大小：%s\n- SHA-256：`%s`\n\n下载后可用 sha256 校验：`sha256sum app-debug.apk`' "$SIZE" "$SHA")" \
            || echo "发布跳过（可能已存在）"
          echo "下载地址："
          echo "${{ github.server_url }}/${{ github.repository }}/releases/download/$TAG/app-debug.apk"
